          EOF
          mkdir -p app/src/main/assets
          ROM=$(find "$GITHUB_WORKSPACE" -maxdepth 1 \( -name '*.sfc' -o -name '*.smc' \) | head -n 1)
          if [ -z "$ROM" ]; then echo "::error title=Falta la ROM::No hay ningun .sfc o .smc en la raiz del repo"; exit 1; fi
          echo "ROM encontrada: $ROM"
          cp "$ROM" "app/src/main/assets/game.${ROM##*.}"
          mkdir -p app/src/main/jniLibs/arm64-v8a
          curl -fL -o core.zip https://buildbot.libretro.com/nightly/android/latest/arm64-v8a/snes9x_libretro_android.so.zip
          unzip -o core.zip
          mv snes9x_libretro_android.so app/src/main/jniLibs/arm64-v8a/libsnes9x.so
          # --- Buscar la ultima version real de LibretroDroid ---
          API=https://api.github.com/repos/Swordfish90/LibretroDroid
          TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" $API/releases/latest | grep -m1 '"tag_name"' | sed -E 's/.*"tag_name": *"([^"]+)".*/\1/' || true)
          if [ -z "$TAG" ]; then
            TAG=$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" $API/tags | grep -m1 '"name"' | sed -E 's/.*"name": *"([^"]+)".*/\1/')
          fi
          if [ -z "$TAG" ]; then echo "::error title=LibretroDroid::No pude averiguar la version"; exit 1; fi
          echo "LibretroDroid version: $TAG"
          sed -i "s/LibretroDroid:0.9.0/LibretroDroid:$TAG/" app/build.gradle.kts
          grep LibretroDroid app/build.gradle.kts
          # JitPack compila la libreria la primera vez que alguien la pide: esperar a que este lista
          POM=https://jitpack.io/com/github/Swordfish90/LibretroDroid/$TAG/LibretroDroid-$TAG.pom
          OK=0
          for i in $(seq 1 24); do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" "$POM" || true)
            echo "JitPack intento $i: HTTP $CODE"
            if [ "$CODE" = "200" ]; then OK=1; break; fi
            sleep 30
          done
          if [ $OK -ne 1 ]; then echo "::error title=JitPack no tiene la libreria::LibretroDroid $TAG no esta disponible en JitPack (HTTP $CODE). Log: https://jitpack.io/com/github/Swordfish90/LibretroDroid/$TAG/build.log"; exit 1; fi
          ls -la app/src/main/jniLibs/arm64-v8a app/src/main/res/mipmap-xxxhdpi app/src/main/assets

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.7

      - name: Compilar
        working-directory: /tmp/proj
        run: |
          set +e
          gradle assembleDebug --no-daemon --stacktrace --console=plain > gradle.log 2>&1
          CODE=$?
          if [ $CODE -ne 0 ]; then
            { grep -E '^e: ' gradle.log | head -n 6; awk '/What went wrong/{f=1} f{print; n++} n>=14{exit}' gradle.log; } > resumen.txt
            if [ ! -s resumen.txt ]; then tail -n 15 gradle.log > resumen.txt; fi
            MSG=$(sed ':a;N;$!ba;s/%/%25/g;s/\r//g;s/\n/%0A/g' resumen.txt)
            echo "::error title=Fallo al compilar::$MSG"
            tail -n 60 gradle.log
            exit $CODE
          fi
          tail -n 5 gradle.log

      - uses: actions/upload-artifact@v4
        with:
          name: StreetChaves2-apk
          path: /tmp/proj/app/build/outputs/apk/debug/*.apk
